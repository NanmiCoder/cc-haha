<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover Must be in the markup: iOS WebKit reads it only once while parsing the document, 
      changing it later from JS has no effect. Without it env(safe-area-inset-*) is all 0, and under the notch and
      Home home indicator the browser grey bar shows through.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F3F0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #F4F3F0;
        /* The page itself never scrolls: scrolling happens in the app lists, so iOS rubber-banding cannot drag the whole page. */
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0F0F0E;
        }
      }
      body {
        overflow: hidden;
      }
      /*
        Follow the visible area: when the soft keyboard opens, the whole app shrinks above it.
        --cc-viewport-height Written by src/ui/webKeyboard.ts.
      */
      #root {
        display: flex;
        height: var(--cc-viewport-height, 100%);
        flex: 1;
      }
    </style>
    <script>
      /*
        iOS Two fixes for mobile browsers, same approach as touchH5.ts in the desktop H5: 
        1. Focusing an input with font size below 16px zooms the page and never zooms back, so lock the zoom scale.
        2. After the soft keyboard closes the page may stay pushed up; pull back to 0 when focus leaves the input.
        Keyboard-open adaptation lives in src/ui/webKeyboard.ts.
      */
      (function () {
        try {
          var nav = window.navigator
          var ios = /iPad|iPhone|iPod/.test(nav.userAgent) ||
            (nav.platform === 'MacIntel' && nav.maxTouchPoints > 1)
          if (ios) {
            var meta = document.querySelector('meta[name="viewport"]')
            if (meta) meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover')
            window.addEventListener('focusout', function () {
              window.requestAnimationFrame(function () {
                var active = document.activeElement
                if (active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return
                if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0)
              })
            })
          }
        } catch (_) {
          /* If the fix fails, fall back to the default full-page height. */
        }
      })()
    </script>
  </head>

  <body>
    <noscript>Please enable JavaScript and reopen cc-haha.</noscript>
    <div id="root"></div>
  </body>
</html>
