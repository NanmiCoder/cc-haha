name: Full Quality
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.functional_upgrade && format('functional1879-u:{0}', inputs.functional_head) || 'Full Quality' }}

# The PR gate is intentionally scoped: it runs only the surfaces a diff can reach.
# That leaves two blind spots no per-PR run can close — regressions that only appear
# when the whole suite runs together, and drift in checks no recent PR happened to
# select. This workflow closes them, without any model, provider, or repository
# secret.
#
# Daily, plus one click away. The maintainer chose a daily sweep (2026-10) once
# main was made green: a red main that nobody re-checks is what turned the PR gate
# into noise. Daily rather than per push, because a full sweep takes about ninety
# minutes and the per-push PR Quality run already covers what each merge touched.

on:
  schedule:
    # 19:00 UTC = 03:00 Beijing, outside working hours.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      skip_coverage:
        description: 'Skip the coverage ratchet (faster smoke of the rest)'
        type: boolean
        default: false
      functional_upgrade:
        description: 'Run only the separately reviewed Issue 1879 isolated functional regression'
        type: boolean
        default: false
      functional_head:
        description: 'Exact reviewed Issue 1879 commit (functional mode only)'
        type: string
        default: ''
      functional_packet_base64:
        description: 'Reviewed canonical once packet, Base64 data only (functional mode only)'
        type: string
        default: ''
      functional_packet_sha256:
        description: 'SHA256 of the exact decoded once packet (functional mode only)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.functional_upgrade && format('functional1879-u-{0}', inputs.functional_head) || 'nightly-quality' }}
  cancel-in-progress: false

jobs:
  full-deterministic:
    name: full-deterministic
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.functional_upgrade) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Agent and skill discovery lists files through ripgrep; without it the
      # runtime suites see every created agent as missing (HTTP 500).
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install --frozen-lockfile

      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      # Every deterministic lane, unconditionally — no path routing, no dependency
      # graph. This is the run that catches a check the router stopped selecting.
      - name: Policy and gate regressions
        run: bun run check:policy
      - name: Deterministic agent flow
        run: bun run check:agent-flow
      - name: Agent loop against a mock LLM and recorded traffic
        run: bun run check:agent-e2e
      - name: Root runtime tests
        run: bun run check:server
      - name: Provider contracts
        run: bun run check:provider-contract
      - name: Desktop/server chat contracts
        run: bun run check:chat-contract
      - name: Adapter tests
        run: bun run check:adapters
      - name: Desktop lint, tests, and build
        run: bun run check:desktop
      - name: Mobile typecheck, lint, and tests
        run: bun run check:mobile
      - name: Setup native Computer Use Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare native Computer Use dependencies
        run: cargo +stable fetch --locked --manifest-path native/agent-desktop/Cargo.toml
      - name: Native Computer Use deterministic checks
        run: bun run check:agent-desktop
      - name: Electron host checks
        run: bun run check:electron
      - name: Persistence upgrade contracts
        run: bun run check:persistence-upgrade
      - name: Quarantine governance
        run: bun run check:quarantine
      - name: Coverage ratchet
        if: ${{ !inputs.skip_coverage }}
        env:
          COVERAGE_BASE_REF: origin/main
        run: bun run check:coverage

      # Real desktop UI, real permission dialog, mock runtime. Skips with a printed
      # reason when agent-browser is unavailable on the runner rather than failing
      # the whole nightly run.
      - name: Deterministic desktop UI smoke
        run: bun run check:desktop-ui-smoke

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-quality
          path: |
            artifacts/agent-flow/
            artifacts/agent-e2e/
            artifacts/desktop-ui-smoke/
            artifacts/coverage/
          retention-days: 14

  selection-drift:
    name: selection-drift
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.functional_upgrade) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      # A dependency graph that silently stops resolving would quietly downgrade the
      # PR gate to prefix-only routing, which is the failure this repository already
      # shipped. Re-prove the graph nightly against the real tree.
      - name: Module graph health
        run: bun test ./scripts/pr/module-graph.test.ts
      - name: Impact report on the full tree
        run: bun run check:impact --files "$(git ls-files 'src/*' 'desktop/*' 'adapters/*' 'mobile/*' | head -400 | tr '\n' ',')"

  # A separate manual functional result. It neither renames nor replaces any
  # ordinary PR/Full Quality check, and cannot inherit an old B/Profile grant.
  p1879u-functional-upgrade:
    name: p1879u-isolated-functional-upgrade
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.functional_upgrade &&
      github.repository == 'NanmiCoder/cc-haha' && github.actor == 'NanmiCoder' &&
      github.ref == 'refs/heads/fix/issue-1879-functional-validation' &&
      github.sha == inputs.functional_head && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      FUNCTIONAL_PACKET_BASE64: ${{ inputs.functional_packet_base64 }}
      FUNCTIONAL_PACKET_SHA256: ${{ inputs.functional_packet_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.functional_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Claim the first separately admitted exact-head functional invocation
        id: functional-claim
        env:
          PROFILE_REVIEW_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/pr/windows-installer-profile-review.ts --functional-upgrade-claim
      - name: Download the reviewed new native Stage A artifact without rebuilding
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.functional-claim.outputs.stage_a_artifact }}
          run-id: ${{ steps.functional-claim.outputs.stage_a_run }}
          repository: NanmiCoder/cc-haha
          github-token: ${{ github.token }}
          merge-multiple: true
          path: D:\a\_temp\cc-haha-1879-functional-download\A
      - name: Download only the fixed historical full Setup
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14109065646'
          run-id: '43581658402'
          repository: NanmiCoder/cc-haha
          github-token: ${{ github.token }}
          merge-multiple: true
          path: D:\a\_temp\cc-haha-1879-functional-download\old
      - name: Download the statically proven prepared package from its actual source run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14109460170'
          run-id: '43581658402'
          repository: NanmiCoder/cc-haha
          github-token: ${{ github.token }}
          merge-multiple: true
          path: D:\a\_temp\cc-haha-1879-functional-download\new
      - name: Verify every input and atomically prepare the new protected functional packet
        id: functional-prepare
        run: bun --no-env-file scripts/pr/windows-installer-profile-review.ts --functional-upgrade-prepare
      - name: Execute the once admitted isolated old to new functional regression
        id: functional-native
        shell: powershell
        env:
          FUNCTIONAL_PACKAGE: ${{ steps.functional-prepare.outputs.package_dir }}
          FUNCTIONAL_CLAIM: ${{ steps.functional-prepare.outputs.claim_file }}
          FUNCTIONAL_PINS_SHA: ${{ steps.functional-prepare.outputs.pins_sha256 }}
          FUNCTIONAL_SPEC_SHA: ${{ steps.functional-prepare.outputs.spec_sha256 }}
          FUNCTIONAL_AUTHORIZATION_SHA: ${{ steps.functional-prepare.outputs.authorization_sha256 }}
          PSModulePath: C:\Windows\System32\WindowsPowerShell\v1.0\Modules
        run: |
          & (Join-Path $env:FUNCTIONAL_PACKAGE 'launch.ps1') -ExecuteFunctionalUpgrade -ApprovedPinsSha256 $env:FUNCTIONAL_PINS_SHA -ApprovedSpecSha256 $env:FUNCTIONAL_SPEC_SHA -ApprovedAuthorizationSha256 $env:FUNCTIONAL_AUTHORIZATION_SHA -ClaimFile $env:FUNCTIONAL_CLAIM
      - name: Collect finite native functional evidence and preserve unknown cleanup
        if: ${{ always() && steps.functional-prepare.outcome == 'success' }}
        env:
          FUNCTIONAL_LAUNCHER_OUTCOME: ${{ steps.functional-native.outcome }}
        run: bun --no-env-file scripts/pr/windows-installer-profile-review.ts --functional-upgrade-collect
      - name: Preserve the distinct functional result and original uncertainty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-functional-upgrade-${{ inputs.functional_head }}-${{ github.run_id }}
          path: artifacts/windows-installer-functional-upgrade/
          if-no-files-found: warn
          retention-days: 7
