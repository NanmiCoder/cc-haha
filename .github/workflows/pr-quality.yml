name: PR Quality
run-name: ${{ github.event_name == 'pull_request' && github.repository == 'NanmiCoder/cc-haha' && github.event.action == 'labeled' && github.event.pull_request.number == 1883 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == 'toBerlinWay/cc-haha' && github.event.pull_request.head.ref == 'fix/installer-fallback-foreign-helpers' && github.actor == 'NanmiCoder' && github.event.sender.login == 'NanmiCoder' && github.event.label.name == format('p1879p-{0}', github.event.pull_request.head.sha) && format('profile1879-p:{0}', github.event.pull_request.head.sha) || github.event.pull_request.title || github.event.head_commit.message || 'PR Quality' }}

# Also runs after every merge to main, scoped to what that push changed. A gate
# that only ever looks at pull requests lets main drift red unnoticed, and then
# every later pull request inherits failures it did not cause.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # An admitted diagnostic is never in an ordinary PR cancellation group.
  group: ${{ github.event_name == 'pull_request' && github.repository == 'NanmiCoder/cc-haha' && github.event.action == 'labeled' && github.event.pull_request.number == 1883 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == 'toBerlinWay/cc-haha' && github.event.pull_request.head.ref == 'fix/installer-fallback-foreign-helpers' && github.actor == 'NanmiCoder' && github.event.sender.login == 'NanmiCoder' && github.event.label.name == format('p1879p-{0}', github.event.pull_request.head.sha) && format('profile1879-p-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('pr-quality-{0}', github.event.pull_request.number || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event_name == 'pull_request' && github.repository == 'NanmiCoder/cc-haha' && github.event.action == 'labeled' && github.event.pull_request.number == 1883 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == 'toBerlinWay/cc-haha' && github.event.pull_request.head.ref == 'fix/installer-fallback-foreign-helpers' && github.actor == 'NanmiCoder' && github.event.sender.login == 'NanmiCoder' && github.event.label.name == format('p1879p-{0}', github.event.pull_request.head.sha)) }}

jobs:
  scope-plan:
    name: scope-plan
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.policy.outputs.areas }}
      area_labels: ${{ steps.policy.outputs.area_labels }}
      blocked: ${{ steps.policy.outputs.blocked }}
      blocking_reasons: ${{ steps.policy.outputs.blocking_reasons }}
      desktop_checks: ${{ steps.policy.outputs.desktop_checks }}
      mobile_checks: ${{ steps.policy.outputs.mobile_checks }}
      server_checks: ${{ steps.policy.outputs.server_checks }}
      adapter_checks: ${{ steps.policy.outputs.adapter_checks }}
      desktop_native_checks: ${{ steps.policy.outputs.desktop_native_checks }}
      provider_contract_checks: ${{ steps.policy.outputs.provider_contract_checks }}
      chat_contract_checks: ${{ steps.policy.outputs.chat_contract_checks }}
      agent_flow_checks: ${{ steps.policy.outputs.agent_flow_checks }}
      agent_e2e_checks: ${{ steps.policy.outputs.agent_e2e_checks }}
      persistence_checks: ${{ steps.policy.outputs.persistence_checks }}
      policy_checks: ${{ steps.policy.outputs.policy_checks }}
      docs_checks: ${{ steps.policy.outputs.docs_checks }}
      coverage_checks: ${{ steps.policy.outputs.coverage_checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          : > changed-files.nul
          : > author.txt
          : > codeowners.txt
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The PR files API stops at 3000 paths. Checkout includes both commits.
            git cat-file -e "${PR_BASE_SHA}^{commit}"
            git cat-file -e "${PR_HEAD_SHA}^{commit}"
            git diff --name-only -z "${PR_BASE_SHA}...${PR_HEAD_SHA}" > changed-files.nul
            jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" > labels.txt
            # A CODEOWNER's own PR needs no maintainer-approval label. Owners come
            # from the base branch, so a PR cannot add its author to the list.
            jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH" > author.txt
            git show "${PR_BASE_SHA}:.github/CODEOWNERS" > codeowners.txt 2>/dev/null || : > codeowners.txt
          else
            # A push to main: scope the run to what the push brought in. A new branch
            # or a force push has no usable "before", so fall back to the last commit.
            if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-only -z "$PUSH_BEFORE" "$PUSH_AFTER" > changed-files.nul
            else
              git diff --name-only -z "${PUSH_AFTER}~1" "$PUSH_AFTER" > changed-files.nul
            fi
            : > labels.txt
          fi

      - name: Build deterministic scope plan
        id: policy
        run: bun run scripts/pr/change-policy.ts --files0 changed-files.nul --labels-file labels.txt --author-file author.txt --codeowners-file codeowners.txt --plan-only

  policy-enforcement:
    name: policy-enforcement
    needs: scope-plan
    if: ${{ always() && needs.scope-plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy sources
        if: needs.scope-plan.outputs.policy_checks == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        if: needs.scope-plan.outputs.policy_checks == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        if: needs.scope-plan.outputs.policy_checks == 'true'
        run: bun install --frozen-lockfile

      - name: Run policy regression tests
        if: needs.scope-plan.outputs.policy_checks == 'true'
        run: bun run check:policy

      - name: Enforce change policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BLOCKED: ${{ needs.scope-plan.outputs.blocked }}
          BLOCKING_REASONS: ${{ needs.scope-plan.outputs.blocking_reasons }}
        run: |
          # Label-based exceptions are granted on the pull request. After the merge the
          # labels are gone, so re-blocking main on them would only make main red.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Change policy was enforced on the pull request"
            exit 0
          fi
          if [ "$BLOCKED" = "true" ]; then
            echo "::error::${BLOCKING_REASONS:-Change policy blocked this pull request}"
            exit 1
          fi
          echo "Change policy passed"

  # Sharded for wall time, not selection: the shards together run every desktop
  # check (shard 1 also lints, the last also builds). Unsharded it took ~8 minutes.
  desktop-checks:
    name: desktop-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.desktop_checks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      # Desktop sidecar tests compile the production sidecar entry, which bundles the
      # IM adapters; without their packages the build fails before any test runs.
      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install --frozen-lockfile
      # `bun run build` also exports the phone app (mobile/) into dist/m, and Expo needs Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile
      - name: Run desktop checks
        run: bun run check:desktop --shard=${{ matrix.shard }}/2

  mobile-checks:
    name: mobile-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.mobile_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile
      - name: Run offline mobile checks
        run: bun run check:mobile

  # Sharded for wall time, not selection: every root test file runs in exactly one
  # shard. One runner took ~9 minutes for ~770 per-file test processes.
  server-checks:
    name: server-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.server_checks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install --frozen-lockfile
      - name: Run root runtime checks
        run: bun run check:server --shard=${{ matrix.shard }}/3

  provider-contract-checks:
    name: provider-contract-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.provider_contract_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Run offline provider contracts
        run: bun run check:provider-contract

  chat-contract-checks:
    name: chat-contract-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.chat_contract_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Run desktop-server chat contracts
        run: bun run check:chat-contract

  agent-flow-checks:
    name: agent-flow-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.agent_flow_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic agent flow
        run: bun run check:agent-flow
      - name: Upload agent flow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-flow
          path: artifacts/agent-flow/
          retention-days: 7

  agent-e2e-checks:
    name: agent-e2e-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.agent_e2e_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
      - name: Run the agent loop against a mock LLM and recorded traffic
        run: bun run check:agent-e2e
      - name: Upload agent e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e
          path: artifacts/agent-e2e/
          retention-days: 7

  adapter-checks:
    name: adapter-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.adapter_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install --frozen-lockfile
      - name: Run adapter checks
        run: bun run check:adapters

  desktop-native-checks:
    name: desktop-native-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.desktop_native_checks == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev patchelf \
            libfuse2 ripgrep
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install --frozen-lockfile
      # The packaged app carries the phone H5 exported from mobile/; Expo needs Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile
      - name: Cache Cloudflare connector build dependency
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/binaries/cloudflared-*
          key: cloudflared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/prepare-cloudflared.ts', 'desktop/scripts/cloudflared-licenses/*') }}
      - name: Prepare bundled Cloudflare connector build dependency
        working-directory: desktop
        run: bun run prepare:cloudflared
      - name: Setup native Computer Use Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare native Computer Use dependencies
        run: cargo +stable fetch --locked --manifest-path native/agent-desktop/Cargo.toml
      - name: Run desktop native checks
        run: bun run check:native

  windows-installer-checks:
    name: windows-installer-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.desktop_native_checks == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      # This is dependency/fixture acquisition, not a test: both downloads are
      # pinned and verified before the offline NSIS harness starts.
      - name: Prepare pinned Windows installer dependencies
        id: prepare
        run: bun --no-env-file scripts/pr/prepare-windows-installer-tests.ts
      - name: Run offline native installer regressions
        run: bun --no-env-file scripts/pr/run-windows-installer-checks.ts
      - name: Compile and test the owned profile fixture (Stage A only)
        if: always() && steps.prepare.outcome == 'success'
        run: bun --no-env-file scripts/pr/run-windows-installer-profile-checks.ts
      - name: Test the profile-only bootstrap producer without accounts or profiles
        run: |
          $env:CC1879_PREFLIGHT_PARENT_PSHOME = $PSHOME
          bun --no-env-file scripts/pr/windows-installer-profile-review.ts --profile-only-bootstrap-preflight
      - name: Probe owned removal primitives without accounts or profiles
        if: always() && steps.prepare.outcome == 'success'
        run: bun --no-env-file test --parallel=1 --max-concurrency=1 --no-orphans ./scripts/pr/windows-installer-removal-primitives.test.ts
      - name: Validate the owned ETW calibration contract
        if: always() && steps.prepare.outcome == 'success'
        run: bun --no-env-file test ./scripts/pr/windows-installer-etw-calibration.test.ts
      # Advisory capability evidence only; unknown ETW support never weakens an existing check.
      - name: Collect owned ETW calibration without accounts or profiles (advisory)
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        env:
          PSModulePath: C:\Windows\System32\WindowsPowerShell\v1.0\Modules
        run: |
          & .\scripts\pr\windows-installer-etw-calibration.ps1 -RunCiCalibration -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts\windows-installer\etw-calibration')
      - name: Upload Windows installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-evidence
          path: artifacts/windows-installer/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve verified historical fixture for profile review
        if: always() && steps.prepare.outputs.fixture_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-v078-fixture
          path: ${{ steps.prepare.outputs.fixture_dir }}
          if-no-files-found: error
          retention-days: 2
      - name: Clean Windows installer temporary directories
        if: always()
        run: bun --no-env-file scripts/pr/run-windows-installer-checks.ts --cleanup-prepared

  # Complete build evidence only. This job creates no account/profile and is
  # outside the required gate; actual installation still needs separate F1 scope.
  windows-candidate-package:
    needs: windows-installer-checks
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'NanmiCoder/cc-haha' &&
      github.event.pull_request.number == 1883 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'toBerlinWay/cc-haha' &&
      github.event.pull_request.head.ref == 'fix/installer-fallback-foreign-helpers' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.run_attempt == 1 &&
      needs.windows-installer-checks.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up the normal release Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        env:
          CARGO_HOME: ${{ runner.temp }}\cc-haha-candidate-toolchain-${{ github.run_id }}\cargo
          RUSTUP_HOME: ${{ runner.temp }}\cc-haha-candidate-toolchain-${{ github.run_id }}\rustup
        with:
          targets: x86_64-pc-windows-msvc
      - name: Validate candidate package preparation boundaries
        run: bun --no-env-file test ./scripts/pr/prepare-windows-installer-candidate-package.test.ts
      - name: Build and statically bind the complete unsigned Windows x64 package
        env:
          WINDOWS_INSTALLER_CHECKS_RESULT: ${{ needs.windows-installer-checks.result }}
          CARGO_HOME: ${{ runner.temp }}\cc-haha-candidate-toolchain-${{ github.run_id }}\cargo
          RUSTUP_HOME: ${{ runner.temp }}\cc-haha-candidate-toolchain-${{ github.run_id }}\rustup
        run: bun --no-env-file scripts/pr/prepare-windows-installer-candidate-package.ts
      - name: Preserve bounded candidate package and original static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-candidate-package-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: artifacts/windows-installer-candidate-package/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  # Diagnostic only. Applying the exact-head label is a separate coordinator
  # admission after review and ordinary CI; no normal push/label runs this job.
  windows-profile-only-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'NanmiCoder/cc-haha' &&
      github.event.sender.login == 'NanmiCoder' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.number == 1883 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'toBerlinWay/cc-haha' &&
      github.event.pull_request.head.ref == 'fix/installer-fallback-foreign-helpers' &&
      github.actor == 'NanmiCoder' &&
      github.run_attempt == 1 &&
      github.event.label.name == format('p1879p-{0}', github.event.pull_request.head.sha)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Claim the first exact-head profile-only invocation with complete history
        env:
          PROFILE_REVIEW_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/pr/windows-installer-profile-review.ts --profile-only-claim
      - name: Download only the verified Stage A fixture without rebuilding
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14070542178'
          merge-multiple: true
          run-id: '43492838022'
          repository: NanmiCoder/cc-haha
          github-token: ${{ github.token }}
          path: D:\a\_temp\cc-haha-1879-profile-only-download
      - name: Atomically prepare private bootstrap, protected claim and A inputs
        id: profile-prepare
        run: bun --no-env-file scripts/pr/windows-installer-profile-review.ts --profile-only-prepare
      - name: Run the separately admitted disabled-SID CreateProfile diagnostic once
        id: profile-only
        shell: powershell
        env:
          PROFILE_PACKAGE: ${{ steps.profile-prepare.outputs.package_dir }}
          PROFILE_A: ${{ steps.profile-prepare.outputs.stage_a_dir }}
          PROFILE_CLAIM: ${{ steps.profile-prepare.outputs.claim_file }}
          PROFILE_PINS_SHA: ${{ steps.profile-prepare.outputs.pins_sha256 }}
          PROFILE_SPEC_SHA: ${{ steps.profile-prepare.outputs.spec_sha256 }}
          PROFILE_ADMISSION_SHA: ${{ steps.profile-prepare.outputs.admission_sha256 }}
          PSModulePath: C:\Windows\System32\WindowsPowerShell\v1.0\Modules
        run: |
          & (Join-Path $env:PROFILE_PACKAGE 'launch-profile-only.proposed.ps1') -ExecuteReviewedProfileOnly -ApprovedPinsSha256 $env:PROFILE_PINS_SHA -ApprovedSpecSha256 $env:PROFILE_SPEC_SHA -ApprovedAdmissionSha256 $env:PROFILE_ADMISSION_SHA -ClaimFile $env:PROFILE_CLAIM -StageAInputDirectory $env:PROFILE_A
      # A separate serial process. Its own gates require launcher/Controller
      # gone, and it never kills, unloads, deletes or reports cleanup success.
      - name: Reconcile only the bound disabled account after an uncertain result
        if: ${{ always() && steps.profile-prepare.outcome == 'success' && steps.profile-only.outcome != 'success' && steps.profile-only.outcome != 'skipped' }}
        shell: powershell
        env:
          PROFILE_PACKAGE: ${{ steps.profile-prepare.outputs.package_dir }}
          PROFILE_CLAIM: ${{ steps.profile-prepare.outputs.claim_file }}
          PROFILE_PINS_SHA: ${{ steps.profile-prepare.outputs.pins_sha256 }}
          PROFILE_SPEC_SHA: ${{ steps.profile-prepare.outputs.spec_sha256 }}
          PROFILE_ADMISSION_SHA: ${{ steps.profile-prepare.outputs.admission_sha256 }}
          PSModulePath: C:\Windows\System32\WindowsPowerShell\v1.0\Modules
        run: |
          & (Join-Path $env:PROFILE_PACKAGE 'reconcile-profile-only.proposed.ps1') -DisableReviewedProfileOnlyOwnedAccount -ApprovedPinsSha256 $env:PROFILE_PINS_SHA -ApprovedSpecSha256 $env:PROFILE_SPEC_SHA -ApprovedAdmissionSha256 $env:PROFILE_ADMISSION_SHA -ClaimFile $env:PROFILE_CLAIM
      - name: Collect bounded original profile-only reports
        if: ${{ always() && steps.profile-prepare.outcome == 'success' }}
        env:
          PROFILE_LAUNCHER_OUTCOME: ${{ steps.profile-only.outcome }}
        run: bun --no-env-file scripts/pr/windows-installer-profile-review.ts --profile-only-collect
      - name: Preserve profile-only evidence and uncertainty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-only-review-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: artifacts/windows-installer-profile-only/
          if-no-files-found: warn
          retention-days: 7

  macos-swift-checks:
    name: macos-swift-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.desktop_native_checks == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Run macOS Swift checks
        run: bun run check:swift

  persistence-checks:
    name: persistence-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.persistence_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Run persistence upgrade contracts
        run: bun run check:persistence-upgrade

  docs-checks:
    name: docs-checks
    needs: scope-plan
    if: needs.scope-plan.outputs.docs_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Run docs checks
        run: npm --prefix site ci && npm --prefix site run build && npm --prefix site run check

  # Advisory: reported on the pull request as its own check, never a merge blocker.
  # None of the agent projects this gate was modelled on block on coverage, and a
  # job that fails for reasons unrelated to the diff trains everyone to ignore the
  # gate. It is also kept out of pr-quality-gate's needs: it takes ~25 minutes, and
  # the required status used to wait for a lane that never decided it.
  coverage-checks:
    name: coverage-checks
    needs: scope-plan
    if: github.event_name == 'pull_request' && needs.scope-plan.outputs.coverage_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install --frozen-lockfile
      - name: Run coverage checks
        env:
          COVERAGE_BASE_REF: origin/${{ github.base_ref }}
        run: bun run check:coverage
      - name: Summarize coverage report
        if: always()
        run: |
          latest_report="$(find artifacts/coverage -name coverage-report.md -print | sort | tail -n 1)"
          if [ -n "$latest_report" ]; then
            cat "$latest_report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage/
          retention-days: 14

  pr-quality-gate:
    name: pr-quality-gate
    needs:
      - scope-plan
      - policy-enforcement
      - desktop-checks
      - mobile-checks
      - server-checks
      - provider-contract-checks
      - chat-contract-checks
      - agent-flow-checks
      - agent-e2e-checks
      - adapter-checks
      - desktop-native-checks
      - windows-installer-checks
      - macos-swift-checks
      - persistence-checks
      - docs-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected quality job to pass
        run: |
          failures=0

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name ended with result: $result"
              failures=$((failures + 1))
            else
              echo "$name: success"
            fi
          }

          require_selected() {
            local name="$1"
            local expected="$2"
            local result="$3"
            if [ "$expected" = "true" ]; then
              require_success "$name" "$result"
            elif [ "$result" != "skipped" ]; then
              echo "::error::$name was not selected but ended with result: $result"
              failures=$((failures + 1))
            else
              echo "$name: skipped by scope plan"
            fi
          }

          require_success "scope-plan" "${{ needs.scope-plan.result }}"
          require_success "policy-enforcement" "${{ needs.policy-enforcement.result }}"
          require_selected "desktop-checks" "${{ needs.scope-plan.outputs.desktop_checks }}" "${{ needs.desktop-checks.result }}"
          require_selected "mobile-checks" "${{ needs.scope-plan.outputs.mobile_checks }}" "${{ needs.mobile-checks.result }}"
          require_selected "server-checks" "${{ needs.scope-plan.outputs.server_checks }}" "${{ needs.server-checks.result }}"
          require_selected "provider-contract-checks" "${{ needs.scope-plan.outputs.provider_contract_checks }}" "${{ needs.provider-contract-checks.result }}"
          require_selected "chat-contract-checks" "${{ needs.scope-plan.outputs.chat_contract_checks }}" "${{ needs.chat-contract-checks.result }}"
          require_selected "agent-flow-checks" "${{ needs.scope-plan.outputs.agent_flow_checks }}" "${{ needs.agent-flow-checks.result }}"
          require_selected "agent-e2e-checks" "${{ needs.scope-plan.outputs.agent_e2e_checks }}" "${{ needs.agent-e2e-checks.result }}"
          require_selected "adapter-checks" "${{ needs.scope-plan.outputs.adapter_checks }}" "${{ needs.adapter-checks.result }}"
          require_selected "desktop-native-checks" "${{ needs.scope-plan.outputs.desktop_native_checks }}" "${{ needs.desktop-native-checks.result }}"
          require_selected "windows-installer-checks" "${{ needs.scope-plan.outputs.desktop_native_checks }}" "${{ needs.windows-installer-checks.result }}"
          require_selected "macos-swift-checks" "${{ needs.scope-plan.outputs.desktop_native_checks }}" "${{ needs.macos-swift-checks.result }}"
          require_selected "persistence-checks" "${{ needs.scope-plan.outputs.persistence_checks }}" "${{ needs.persistence-checks.result }}"
          require_selected "docs-checks" "${{ needs.scope-plan.outputs.docs_checks }}" "${{ needs.docs-checks.result }}"

          if [ "$failures" -gt 0 ]; then
            exit 1
          fi
